[build]
  publish = "."

# Edge Functions manejan: /proxy-binance-demo/*, /proxy-binance-real/*, /proxy-binance/*
# (definido en netlify/edge-functions/binance-proxy.js → config.path)
# Los redirects simples NO soportan POST con headers personalizados (X-MBX-APIKEY)

# SPA fallback — todo lo que no sea un archivo va a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
