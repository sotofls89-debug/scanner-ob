[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/proxy-binance-demo/*"
  to = "https://testnet.binancefuture.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy-binance-real/*"
  to = "https://fapi.binance.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy-binance/*"
  to = "https://fapi.binance.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, X-MBX-APIKEY, x-mbx-apikey, Authorization, *"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"